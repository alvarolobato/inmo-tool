# -----------------------------------------------------------------------------
# ETL -> Dashboard callback (issue #94)
# -----------------------------------------------------------------------------
- key: etl.dashboard_base_url
  env: ETL_DASHBOARD_BASE_URL
  type: string
  sensitive: false
  default: "http://dashboard:4000"
  section: "ETL"
  description: "URL base del dashboard, vista desde el contenedor ETL. Al terminar cada ciclo de conectores, el orquestador hace POST a {base}/api/profiles/materialize-all para que los inmuebles recién ingeridos se materialicen y puntúen sin intervención manual (issue #94). El valor por defecto usa el DNS interno de docker-compose; ponlo a cadena vacía para desactivar el aviso por completo."
  requires_restart: [etl]
  components: [etl]

- key: etl.dashboard_callback_timeout_seconds
  env: ETL_DASHBOARD_CALLBACK_TIMEOUT_SECONDS
  type: int
  sensitive: false
  default: 30
  section: "ETL"
  description: "Tiempo máximo de espera (segundos) del aviso POST al dashboard tras un ciclo de conectores. Al agotarse se registra un warning y el ciclo se da por bueno igualmente: los datos ya están ingeridos y la materialización es idempotente, así que se recupera en el siguiente ciclo."
  requires_restart: [etl]
  components: [etl]

- key: etl.min_restart_sweep_interval_seconds
  env: ETL_MIN_RESTART_SWEEP_INTERVAL_SECONDS
  type: int
  sensitive: false
  default: 900
  section: "ETL"
  description: "Intervalo mínimo (segundos) desde el último connector_run completado antes de permitir un nuevo barrido inmediato al arrancar (issue #172). Un reinicio en bucle repetiría el barrido completo de todos los conectores en cada intento; por debajo de este umbral el barrido se salta y se registra en el log, esperando al siguiente ciclo programado. 0 desactiva la protección."
  requires_restart: [etl]
  components: [etl]

- key: etl.dedup_max_runtime_seconds
  env: ETL_DEDUP_MAX_RUNTIME_SECONDS
  type: int
  sensitive: false
  default: 7200
  section: "ETL"
  description: "Vida máxima (segundos) de un pase de deduplicación antes de considerarlo huérfano (D-036). Una fila dedup_runs que siga en status='running' pasado este tiempo sin un proceso activo (contenedor matado, OOM, reinicio) se reconcilia a 'failed' con un error_msg explicativo al arrancar el ETL y al inicio de cada pase de dedup. Por defecto 2h: holgura sobre el ~84 min que tarda hoy un pase, muy por debajo de las horas que llegaron a acumular las filas huérfanas en producción."
  requires_restart: [etl]
  components: [etl]

- key: etl.materialize_reconciler_interval_seconds
  env: ETL_MATERIALIZE_RECONCILER_INTERVAL_SECONDS
  type: int
  sensitive: false
  default: 120
  section: "ETL"
  description: "Cadencia (segundos) del reconciliador de materialización de perfiles (issue #285, D-046). Un hilo independiente del barrido comprueba si algún perfil activo se ha quedado obsoleto (su last_materialized_at es anterior al listing más reciente, o nunca se materializó) porque se perdió/falló un aviso notify_materialize_all en alguna vía de ingesta, y en ese caso vuelve a disparar el mismo materialize-all. Es una red de seguridad barata: la comprobación es una sola consulta agregada y solo dispara cuando de verdad se saltó un aviso. Por defecto 2 min, que acota cuánto tiempo puede quedar obsoleto un perfil. Debe ser positivo."
  requires_restart: [etl]
  components: [etl]

- key: etl.default_freshness_interval_hours
  env: ETL_DEFAULT_FRESHNESS_INTERVAL_HOURS
  type: int
  sensitive: false
  default: 24
  section: "ETL"
  description: "Cadencia de frescura por defecto (horas) para un conector sin override (issue #295, D-050). Un conector solo INICIA un ciclo de refresco cuando sus datos son más antiguos que este intervalo; una vez fresco, el barrido programado lo salta (sin fila connector_run_results) hasta que vuelve a vencer. Un ciclo en curso continúa siempre, sin importar el intervalo. Override por conector en connector_config.freshness_interval_hours. Por defecto 24h, coincidiendo con FRESHNESS_STALE_THRESHOLD_HOURS del dashboard (#241). Las ejecuciones manuales ('Ejecutar ahora', ps connector run) ignoran esta puerta."
  requires_restart: [etl]
  components: [etl]

- key: etl.freshness_cycle_stuck_after_hours
  env: ETL_FRESHNESS_CYCLE_STUCK_AFTER_HOURS
  type: int
  sensitive: false
  default: 168
  section: "ETL"
  description: "Antigüedad (horas) a partir de la cual un ciclo de refresco en curso se considera 'atascado' para observabilidad (issue #295, D-050). Solo es un umbral de visibilidad: un ciclo cuyo cycle_started_at supera este tiempo registra un WARNING y se muestra como 'atascado' (p. ej. Fotocasa abriendo el breaker en cada tick — #270), pero NUNCA se fuerza a completarse; un conector que no puede refrescarse del todo se muestra honestamente como 'refrescando' para siempre, jamás como falsamente fresco. Por defecto 168h (7 días)."
  requires_restart: [etl]
  components: [etl]

