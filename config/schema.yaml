# inmo-tool — unified configuration schema
# Each entry defines one configuration key with its env-var mapping, type,
# section, sensitivity, default value, description, restart requirements,
# and which component(s) consume it.
#
# Field reference:
#   key          dot-namespaced identifier (e.g. postgres.host)
#   env          name of the corresponding environment variable
#   type         string | int | bool | enum
#   enum_values  allowed values when type==enum
#   sensitive    true → value contains secrets; redact in API responses
#   default      null means required (no default)
#   section      grouping label for the admin UI
#   description  human-readable description (Spanish for end-users)
#   requires_restart  list of service names that need a restart when this key changes
#   components   list of systems that read this key: dashboard | etl | cli | docker

# -----------------------------------------------------------------------------
# Connector sources (source-site credentials/config) — placeholder
# -----------------------------------------------------------------------------
# The 4D-specific keys that lived here (fourd.host/port/user/password) were
# removed in task 1.1 (#9) — this repo has no 4D source anymore. Real keys for
# whichever listing-site connectors land in tasks 1.4/2.1 (#12/#15) belong
# here once they exist; don't pre-guess their shape now.

# Cimenta2 detail-fetch (issue #136, D-035). The endpoint URL is a secret that
# is NEVER committed to this public repo — default is null (unset), which keeps
# the connector discovery-only. Inject the real value via the env var only
# (owner's local ~/.config/inmo-tool/.env or a GitHub secret).
- key: cimenta2.detail_endpoint
  env: CIMENTA2_DETAIL_ENDPOINT
  type: string
  sensitive: true
  default: null
  section: "Connectors"
  description: "Endpoint Aura getRecord del que el conector Cimenta2 obtiene el detalle de cada inmueble (issue #136). Sin valor (por defecto) el conector se queda solo en descubrimiento por sitemap y no hace ninguna petición de detalle. El valor real NUNCA se versiona en este repo público; se inyecta por variable de entorno. Ver D-035."
  requires_restart: [etl]
  components: [etl]

- key: cimenta2.include_internal
  env: CIMENTA2_INCLUDE_INTERNAL
  type: bool
  sensitive: false
  default: false
  section: "Connectors"
  description: "Si es true, el conector Cimenta2 guarda los campos comerciales internos del banco (coste de adquisición, valor de tasación) en listing.raw_extra. Por defecto false. Los campos de contacto del propietario nunca se guardan, con este flag activo o no (D-035)."
  requires_restart: [etl]
  components: [etl]

# -----------------------------------------------------------------------------
# Captura (task-driven guided-capture page — issue #289)
# -----------------------------------------------------------------------------
# The /captura page shows one openable capture TASK per (profile × portal ×
# section). Each task greys out for `capture.staleness_days` after it was last
# run, then returns to colour (due again). The per-portal keys override the
# global default for that portal only; leave them unset (null) to inherit the
# global value. Resolution: env > config.yaml > default, per key, with
# per-portal winning over global (see dashboard/lib/captura-tasks.ts).
- key: capture.staleness_days
  env: CAPTURE_STALENESS_DAYS
  type: int
  sensitive: false
  default: 7
  section: "Captura"
  description: "Ventana de caducidad (días) de una tarea de captura: tras ejecutarla, la tarea queda atenuada (hecha) durante estos días; al pasar la ventana vuelve a estar activa (toca repetirla). Es solo una señal visual — siempre se puede repetir antes. Valor global; se puede afinar por portal."
  requires_restart: []
  components: [dashboard]

- key: capture.staleness_days_idealista
  env: CAPTURE_STALENESS_DAYS_IDEALISTA
  type: int
  sensitive: false
  default: null
  section: "Captura"
  description: "Ventana de caducidad (días) específica para las tareas de Idealista. Sin valor hereda capture.staleness_days (el global)."
  requires_restart: []
  components: [dashboard]

- key: capture.staleness_days_aliseda
  env: CAPTURE_STALENESS_DAYS_ALISEDA
  type: int
  sensitive: false
  default: null
  section: "Captura"
  description: "Ventana de caducidad (días) específica para las tareas de Aliseda. Sin valor hereda capture.staleness_days (el global)."
  requires_restart: []
  components: [dashboard]

# -----------------------------------------------------------------------------
# Flip / reforma-ARV (buy-to-flip thesis metrics — issue #45, D-058)
# -----------------------------------------------------------------------------
# €/m² refurbishment bands + a transaction/holding buffer, used to estimate
# renovation cost, after-repair value (ARV) and flip margin for profiles marked
# thesis_type: "flip". Deliberately ROUGH, directional v1 placeholders the owner
# tunes against real regional cost data WITHOUT a code change — the calc logic
# (dashboard/lib/analytics/renovation-estimate.ts / arv.ts / flip-margin.ts)
# reads these via dashboard/lib/analytics/flip-config.ts. Read only by the
# dashboard; env > config.yaml > default like every other key.
- key: flip.refurb_cost_leve_eur_m2
  env: FLIP_REFURB_COST_LEVE_EUR_M2
  type: int
  sensitive: false
  default: 400
  section: "Flip"
  description: "Coste de reforma aproximado (€/m²) para una reforma LIGERA (renovation_severity=leve: pintura, cocina/baño, suelos). Valor orientativo v1; ajústalo a tu mercado. Solo se usa en perfiles con thesis_type=flip."
  requires_restart: []
  components: [dashboard]

- key: flip.refurb_cost_integral_eur_m2
  env: FLIP_REFURB_COST_INTEGRAL_EUR_M2
  type: int
  sensitive: false
  default: 900
  section: "Flip"
  description: "Coste de reforma aproximado (€/m²) para una reforma INTEGRAL (renovation_severity=integral: estructural, instalaciones, vaciado). Valor orientativo v1; ajústalo a tu mercado."
  requires_restart: []
  components: [dashboard]

- key: flip.refurb_cost_unknown_eur_m2
  env: FLIP_REFURB_COST_UNKNOWN_EUR_M2
  type: int
  sensitive: false
  default: 650
  section: "Flip"
  description: "Coste de reforma aproximado (€/m²) cuando el inmueble está 'a reformar' pero no se ha podido graduar la profundidad (renovation_severity=unknown/null). Banda MEDIA conservadora, marcada como provisional. Valor orientativo v1."
  requires_restart: []
  components: [dashboard]

- key: flip.sale_holding_cost_pct
  env: FLIP_SALE_HOLDING_COST_PCT
  type: int
  sensitive: false
  default: 10
  section: "Flip"
  description: "Colchón de gastos de transacción y tenencia de un flip (impuestos de compra, comisión de venta, gastos durante la obra) como % del precio de compra. Regla gruesa v1; se resta al calcular el margen de flip. Ajustable."
  requires_restart: []
  components: [dashboard]

