# -----------------------------------------------------------------------------
# ETL
# -----------------------------------------------------------------------------

# etl.cron_hour / etl.delta_cron_minute removed in task 1.6 (#14) — both
# described the source project's nightly-full + hourly-delta cron model
# (a specific full-sync hour, a delta-sync minute-of-hour that skips itself
# when a full run is already active). The connector orchestrator's actual
# scheduler (etl/orchestrator.py run_scheduler_loop) has no such split: it
# runs every registered connector immediately on startup, then on a flat
# hourly interval (_RUN_INTERVAL_SECONDS) — ETL_CRON_HOUR was never read by
# any code in this repo, silently dead since task 1.1. Removed from
# docker-compose.yml/.env.example alongside this. Re-add an equivalent if
# a later phase needs connectors on different schedules (e.g. a slow
# comp-data source that shouldn't run hourly).

# etl.delta_lookback_days removed in task 1.1 (#9) — its rationale (4D/p4d
# replication-delay compensation) is source-specific and won't transfer to
# whatever consistency model real connectors need. Re-add if a connector
# genuinely needs an equivalent overlap window.

