# inmo-tool — local stack
# Services: PostgreSQL mirror + connector sync scheduler + OTel collector + Dashboard App
#
# Status: task 1.1 (#9) removed the source project's WrenAI stack (bootstrap/
# wren-engine/ibis-server/wren-ai-service/wren-ui/qdrant, 6 containers) and
# 4D-specific env vars. Task 1.6 (#14) verified `docker compose up -d` brings
# up exactly these 4 services end-to-end (postgres, etl, otel-collector,
# dashboard — all healthy) and fixed a real blocker found in the process: the
# pinned elastic-agent:8.16.0 image doesn't support the `tail_sampling`
# processor or `zpages` extension this config originally referenced, which
# left otel-collector permanently unhealthy and blocked etl/dashboard from
# starting at all (see otel/otelcol-config.yaml for the fix). The `etl`
# service name is kept as-is rather than renamed to something like
# "connector-runner" — not worth the doc/script churn for a cosmetic rename.
#
# Quick start (symlink to centralized credentials):
#   ln -sf ~/.config/inmo-tool/.env .env
#   docker compose up -d
#
# Or copy .env.example and fill in manually:
#   cp .env.example .env && $EDITOR .env

networks:
  app:
    driver: bridge

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — mirror of ingested listing data
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 1gb
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-inmotool}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-inmotool}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # OTel Collector — EDOT collector (Elastic Agent in OTel collector mode)
  # Receives OTLP traces/metrics/logs from ETL + Dashboard, applies redaction,
  # exports to Elastic Cloud (when ELASTIC_OTLP_ENDPOINT is set) or falls back
  # to a local JSONL file under ./otel/local/. No trace sampling currently —
  # see otel/otelcol-config.yaml for why (task 1.6, #14) and issue #52 for
  # restoring it.
  # ---------------------------------------------------------------------------
  otel-collector:
    image: docker.elastic.co/elastic-agent/elastic-agent:8.16.0
    restart: unless-stopped
    command: ["otel", "--config", "/etc/otelcol/config.yaml"]
    environment:
      # Required: tells the Elastic Agent entrypoint to run in OTel collector
      # mode (elastic-agent otel) instead of Fleet mode (elastic-agent container).
      # Without this the health endpoint on port 13133 never binds.
      ELASTIC_AGENT_OTEL: "true"
      # Pass ELASTIC_ credentials through only when set on the host so the
      # otelcol-config.yaml fallback defaults kick in cleanly in local dev.
      ELASTIC_OTLP_ENDPOINT:
      ELASTIC_OTLP_API_KEY:
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./otel/otelcol-config.yaml:/etc/otelcol/config.yaml:ro
      - ./otel/local:/var/log/otel
      # Filelog bind-mount (Linux only): commented out so `docker compose up -d`
      # works on macOS / Docker Desktop where /var/lib/docker/containers is inside
      # a VM and the host path does not exist. On Linux, enable via the override:
      #   docker compose -f docker-compose.yml -f docker-compose.linux.yml up -d
      # The filelog receiver in otelcol-config.yaml is always compiled in; without
      # this mount it simply idles (no files to tail) — no errors, no crash.
    expose:
      - "4317"   # OTLP gRPC
      - "4318"   # OTLP HTTP
      - "13133"  # health_check extension
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:13133/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # ETL / connector sync — runs every registered connector (etl/connectors/,
  # currently just Fotocasa, task 1.4) immediately on startup, then hourly.
  # For a one-off sync of a single connector: ps connector run <name>
  # (task 1.5, #13) — or directly: docker compose run --rm etl python -m
  # etl.main --once [--connector <name>]
  # ---------------------------------------------------------------------------
  etl:
    build: ./etl
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-inmotool}
      # CONFIG_FILE pins the config path to the host-mounted /config directory.
      # Without it the loader would fall back to ~/.config/inmo-tool/config.yaml
      # (inside the container) which does not exist.
      CONFIG_FILE: /config/config.yaml
      CONFIG_SCHEMA_PATH: /app/config/schema.yaml
      # Issue #94: after each connector run the orchestrator POSTs
      # {base}/api/profiles/materialize-all so newly ingested listings get
      # materialized into profiles and scored without a manual trigger.
      # Uses compose's service-name DNS on the shared `app` network; the
      # dashboard listens on 4000 inside the container regardless of which
      # host port DASHBOARD_PORT publishes. Set to "" to disable the call.
      ETL_DASHBOARD_BASE_URL: ${ETL_DASHBOARD_BASE_URL:-http://dashboard:4000}
      # Same shared secret the dashboard validates (`adminApiKeyValid`) —
      # materialize-all is an authenticated write trigger, not a public one.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      # OTel SDK env vars — picked up automatically by opentelemetry-instrument
      OTEL_SERVICE_NAME: inmo-tool-etl
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      # Mount centralized config directory (read-only; ETL only reads config)
      - ${INMO_TOOL_CONFIG_DIR:-${HOME}/.config/inmo-tool}:/config:ro
      # Mount schema so the container can validate/read key definitions
      - ./config/schema.yaml:/app/config/schema.yaml:ro
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      # Process-liveness only (task 1.6, #14 review — this service had no
      # healthcheck at all before, unlike the other 3): confirms the
      # scheduler process hasn't crashed/exited, not that a sweep is
      # succeeding — a wedged-but-alive loop still reports healthy. A real
      # progress-based check (e.g. a heartbeat file touched each cycle)
      # is a reasonable follow-up once there's more than one connector's
      # worth of real-world runtime behavior to design it against.
      test: ["CMD-SHELL", "pgrep -f 'etl.main' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Dashboard App — AI-driven UI (Next.js + Tremor, port 4000). UI content is
  # the source project's old BI-dashboard-generation flows, untouched by task
  # 1.1 by design — Phase 2/4 tasks replace it. The shell/LLM plumbing is reused.
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: ./dashboard
      args:
        # Set automatically by `ps stack` when .git exists; override for CI (e.g. git describe --tags --always --dirty)
        APP_GIT_DESCRIBE: ${APP_GIT_DESCRIBE:-}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-inmotool}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-}
      # CONFIG_FILE pins the config path to the host-mounted /config directory.
      # Without it the loader would fall back to ~/.config/inmo-tool/config.yaml
      # (inside the container) which does not exist.
      CONFIG_FILE: /config/config.yaml
      CONFIG_SCHEMA_PATH: /app/config/schema.yaml
      # DASHBOARD_LLM_PROVIDER / DASHBOARD_LLM_MODEL_* / DASHBOARD_LLM_CLI_*
      # intentionally NOT set here — the values come from config.yaml
      # (env > config.yaml > default precedence). Setting a default here would
      # silently override the operator's config.yaml choice and block editing
      # from the admin /config UI (env-sourced keys are surfaced as read-only).
      # Set them on the host shell only if you genuinely want a hard override.
      # Claude Code CLI credentials for DASHBOARD_LLM_PROVIDER=cli.
      # Run `claude /install-github-app` once to generate a 1-year OAuth token.
      # Copy the full contents of ~/.claude/.credentials.json into your
      # ~/.config/inmo-tool/.env as CLAUDE_CODE_OAUTH_TOKEN='<json>'.
      # The CLI reads this env var directly — no file mount needed.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      HOME: /home/nextjs
      # OTel SDK env vars — picked up automatically by the Node SDK
      OTEL_SERVICE_NAME: inmo-tool-dashboard
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Git SHA baked at build time; available to the OTel resource as service.version
      NEXT_PUBLIC_GIT_SHA: ${APP_GIT_DESCRIBE:-}
      # Conversation context logs (the exact payload sent to the LLM per turn) are
      # written to files under this dir; the DB stores only the pointer. The dir is
      # a bind-mounted volume (below) so the logs survive container recreation.
      DASHBOARD_CONTEXT_DIR: /app/data/conversations
    volumes:
      # Mount centralized config directory (read-write; dashboard writes config.yaml)
      - ${INMO_TOOL_CONFIG_DIR:-${HOME}/.config/inmo-tool}:/config:rw
      # Mount schema so the container can validate/read key definitions
      - ./config/schema.yaml:/app/config/schema.yaml:ro
      # Mount the canonical PostgreSQL DDL so the dashboard's Next.js
      # instrumentation hook can apply pending migrations on startup
      # (idempotent — CREATE TABLE IF NOT EXISTS). Both ETL and Dashboard
      # apply the same file; init.sql is the single source of schema truth.
      - ./etl/schema/init.sql:/app/schema/init.sql:ro
      # Per-turn conversation context logs (bind mount; survives restarts).
      - ./data/dashboard/conversations:/app/data/conversations:rw
      # Note: CLAUDE_CODE_OAUTH_TOKEN is passed via env (above). No file mount needed.
    ports:
      - "${DASHBOARD_PORT:-4000}:4000"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health | grep -qF '\"status\":\"ok\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
