<!DOCTYPE html>
<!--
  SYNTHETIC fixture for issue #654 (idealista stored 3 photos per listing
  while the captured HTML already carried all of them).

  Nothing in this file is scraped listing content. Every image id, hash
  path, caption, street name, price, area and coordinate pair is
  fabricated. What IS transcribed from a real page is the *schema shape*,
  taken from production extension_capture id 3627 (an idealista detail-page
  capture, HTML retained under D-150):

    * `config.multimediaCarrousel` — `multimedias[type=PICTURE].content`
      capped at a 3-item preview at the `WEB_DETAIL-M-L` rendition, with a
      sibling `totalMultimedias` reporting the true per-type counts. (Real
      capture: 3 embedded, PICTURE total 18, PLAN total 2.)
    * `fullScreenGalleryPics` — a flat array with one entry per multimedia
      item in the full-screen gallery, at the unsuffixed `WEB_DETAIL`
      rendition, carrying `imageDataService` / `imageDataServiceWebp` /
      `isPlan` / `absolutePosition` / `multimediaId`, with UNQUOTED
      identifier keys mixed in among quoted ones. This is the complete set
      and the object the connector was not reading.
    * `picturesWithoutPlans` — the sibling array holding exactly the
      `isPlan: false` entries (18 here, as on the real capture). The
      connector reads only its LENGTH, as a second, independent source for
      the declared photo total alongside `totalMultimedias`.

  Three details here are load-bearing and are all faithful to the real
  capture, not invented for convenience:

    1. The last two gallery entries carry their multimedia id in
       `absolutePosition` (9100000001 / 9100000002) rather than a position.
       The real capture does exactly this for 2 of its 20 items, the two
       most recently added. The connector must use ARRAY order: not
       because an ascending sort would reorder THIS sample (it would not),
       but because the field is not a position for every entry.
    2. The two floor plans are flagged only by `isPlan: true` — they sit on
       the same `id.pro.es.image.master` bucket as the photos, so no
       URL-shape check can distinguish them.
    3. The carousel preview holds the SAME first three photos as the
       gallery but at a different size variant (`WEB_DETAIL-M-L` vs
       `WEB_DETAIL`). They must dedup to one photo each, which is why the
       dedup key is the master path and not the full URL.

  One deliberate DEPARTURE from the real capture: a fourth photo
  (9200000001) that appears in the carousel preview and NOT in the gallery
  array. A real page has no such item; it is here so the fallback merge in
  `_photo_gallery` is actually exercised by a test rather than being
  untested defensive code.

  Expected parse: 18 gallery photos + 1 carousel-only photo = 19, cover shot
  (9000000001) first, both plans excluded. Declared total is 18, so 19 is
  NOT flagged truncated — that deliberate departure is exactly the
  more-than-declared case the flag must not misfire on.
-->
