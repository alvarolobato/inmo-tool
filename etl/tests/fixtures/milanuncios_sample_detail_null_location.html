<!--
Regression fixture for a real crash found in Opus review of PR #54:
location.city / location.province present-but-null (not absent) used to
raise AttributeError via `.get("city", {}).get(...)` — the {} default only
applies when the key is *missing*, not when it's present with a null value.
Milanuncios listings without a resolved city (broader "provincia" ads, or a
listing pending geocoding) hit this in practice, not just in theory.
-->
