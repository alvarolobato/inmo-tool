during rate measurement. HTTP 200, ~95,989 bytes on the wire (vs.

challenge ("Pardon Our Interruption" / "noindex, nofollow"), not a page-
structure change or a removed ad. Trimmed here to the identifying head
meta tags and body text; the original also carries a large inline CSS
block and a base64 PNG logo, neither of which any parsing code reads.

-->

<html lang="es">
  <head>
    <meta charset="utf-8" />
    <noscript>
      <title>Pardon Our Interruption</title>
    </noscript>
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
  </head>

    <div class="container">
      <div class="body">

        </div>
        <div id="captcha-box"></div>
