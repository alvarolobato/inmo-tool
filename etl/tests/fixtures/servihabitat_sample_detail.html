<!DOCTYPE html>
<!-- Trimmed from a real Servihabitat page (ref 60645658, Madrid, 2026-08-02).

     Two things here are load-bearing; do not "tidy" either away.

     1. The "similar listings" neighbour card is retained on purpose, and
        every figure on it differs from the subject's: 48 m2 / 3 hab. /
        2 banos / 190.000 EUR / energy A, against the subject's 80 m2 /
        2 hab. / 1 bano / 230.000 EUR / energy E. An unscoped text scan
        reads the neighbour's values instead, so removing this card would
        silently retire that regression.

     2. #product_features carries the subject's own price, rooms, baths and
        energy letter. The price there is what makes the JSON-LD fallback
        test real: strip the JSON-LD and the price must still resolve to
        230.000 from this block. Before it existed the page body held no
        subject price at all, so the fallback returned None and the test's
        `!= 190000` assertion passed vacuously (Opus review, PR #141). -->

        	"description": "Vivienda en venta en Mad-Tetuan: Cuatro Caminos (Madrid)",
        	"offers": {
        		"@type": "Offer",
        		"priceCurrency": "EUR",
        		"price": "230000",
        		"availableAtOrFrom": {
        			"@type": "Place",
        			"address":{
        				"@type": "PostalAddress",
        				"streetAddress": "C. Jose Calvo, 9",
        				"addressLocality":"Mad-Tetuan: Cuatro Caminos",
        				"addressRegion":"Madrid",
        				"postalCode":"28039"
        			}
        		},
        		"seller": {
        			"@type": "RealEstateAgent",
        			"name": "Servihabitat",
        			"image":"https://www.servihabitat.com/image/layout_set_logo?img_id=1093339&t=1642034324299"
        		}
        	}
        }
    </script>
<meta property="og:description" content="Vivienda de 80 m2 en venta"/>
<meta property="og:image" content="https://static.servihabitat.com/60645658.jpg"/>
</head><body>

      Calificación energética: E</div>

</section>
