# EDOT (Elastic Agent in OTel Collector mode) configuration for inmo-tool.
#
# Exporter selection:
#   ELASTIC_OTLP_ENDPOINT unset → elasticsearch exporter falls back to a
#     dummy endpoint (http://localhost:1) that immediately refuses connections;
#     retry exhausts and drops silently. Spans are captured by the file exporter.
#   ELASTIC_OTLP_ENDPOINT set   → spans/metrics/logs flow to Elastic Cloud APM.
#     File exporter continues writing to ./otel/local/ for offline inspection.
#
# Both exporters are always defined in all pipelines so OTel Collector starts
# cleanly without "unreferenced exporter" validation errors. In local dev only
# the file exporter produces useful output.
#
# See docker-compose.yml for the ENVIRONMENT env var (development / production).

extensions:
  health_check:
    endpoint: "0.0.0.0:13133"
  # zpages removed (task 1.6, #14): the pinned elastic-agent:8.16.0 image's
  # OTel collector build does not compile it in — confirmed live, the
  # container logs "unknown type: zpages (valid values: [memory_limiter
  # file_storage health_check pprof])" and never becomes healthy, which
  # blocks etl/dashboard from starting at all (both depend_on
  # otel-collector: service_healthy). Not a config typo; re-add only if a
  # future image pin's valid-extensions list includes it again.

receivers:
  # OTLP receiver — accepts traces, metrics, and logs from ETL and Dashboard.
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

  # Filelog receiver — ingests container stdout from Docker JSON log files.
  # Parses the standard Docker JSON log format ({"log":"...","stream":"stdout","time":"..."}).
  filelog:
    include:
      - /var/lib/docker/containers/*/*.log
    start_at: end
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%dT%H:%M:%S.%LZ'
      - type: move
        from: attributes.log
        to: body
      - type: remove
        field: attributes.time

processors:
  # Memory limiter — prevents OOM when export stalls and the queue fills.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Batch processor — groups records for efficient export.
  batch:
    send_batch_size: 512
    timeout: 5s
    send_batch_max_size: 1024

  # Resource processor — stamps deployment.environment on every signal.
  resource:
    attributes:
      - key: deployment.environment
        value: "${env:ENVIRONMENT}"
        action: upsert

  # Attributes processor — PII and secret redaction.
  # Deletes a fixed set of exact attribute keys known to carry credentials.
  # Mirrors the denylist in dashboard/lib/llm-provider/sanitize.ts.
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      # Drop any credential attributes that app code might accidentally add.
      # db.user carries the PostgreSQL username, which reveals internal
      # account naming conventions; treated as sensitive here per policy.
      - key: db.user
        action: delete
      - key: openrouter.api_key
        action: delete
      - key: postgres.password
        action: delete

  # Tail sampling removed (task 1.6, #14): the pinned elastic-agent:8.16.0
  # image's OTel collector build does not compile this processor in either
  # (same "unknown type" failure as zpages above — confirmed live) and,
  # unlike zpages, this one is referenced inside a pipeline, not just
  # `service.extensions`, so it silently prevented the collector from
  # starting at all rather than just disabling a feature.
  #
  # This is a real, not-yet-restored regression, not just a config
  # simplification: every trace is now exported (see `traces_sampler:
  # parentbased_always_on` in docker-compose.yml's etl/dashboard env), with
  # no way to reproduce the old "keep 100% of errors and slow (>5s) traces,
  # sample only 10% of normal ones" behavior — head sampling (the only kind
  # this image's valid-processors list supports; `elastictrace` is an APM
  # span-enrichment processor, not a sampler, so it's not a substitute)
  # can't inspect a trace's outcome/duration before deciding to keep it.
  # Harmless for Phase 1's local-dev/file-sink usage, but worth fixing
  # properly (either a different collector image, or accepting head
  # sampling via OTEL_TRACES_SAMPLER=parentbased_traceidratio +
  # OTEL_TRACES_SAMPLER_ARG=0.1) before any real production/cost-sensitive
  # deployment — see issue #52 for options.

exporters:
  # File exporter — always-on local sink. In production this writes a rolling
  # log alongside the Elastic export; in local dev it is the only useful sink.
  file:
    path: /var/log/otel/local.jsonl
    rotation:
      max_megabytes: 50
      max_days: 7
      max_backups: 3

  # Elasticsearch (OTLP/HTTP) exporter — ships to Elastic Cloud APM.
  # Falls back to http://localhost:1 (connection refused) when
  # ELASTIC_OTLP_ENDPOINT is not set; retry exhausts and drops silently,
  # so the file exporter captures all data in local dev without errors.
  otlphttp/elasticsearch:
    endpoint: "${env:ELASTIC_OTLP_ENDPOINT:-http://localhost:1}"
    headers:
      Authorization: "ApiKey ${env:ELASTIC_OTLP_API_KEY:-placeholder}"
    compression: gzip
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 30s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 2048

service:
  extensions: [health_check]
  pipelines:
    # Traces — no tail-sampling (see the processors section above for why);
    # every trace is exported as-is until that's re-added against a
    # compatible processor.
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource, batch]
      exporters: [file, otlphttp/elasticsearch]

    # Metrics — no sampling (metrics are pre-aggregated before ingestion).
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource, batch]
      exporters: [file, otlphttp/elasticsearch]

    # Logs — container stdout (filelog) + OTel log API records (otlp).
    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, attributes/redact, resource, batch]
      exporters: [file, otlphttp/elasticsearch]
